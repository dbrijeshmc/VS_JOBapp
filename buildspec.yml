version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend
      - npm ci
      - cd ..
      - echo "Installing backend dependencies..."
      - python -m pip install --upgrade pip
      - python -m pip install -r backend/requirements.txt

  build:
    commands:
      - echo "Building frontend..."
      - cd frontend
      - npm run build
      - cd ..

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - '**/node_modules/**/*'
    - '**/venv/**/*'
    - '**/.pytest_cache/**/*'
    - '**/__pycache__/**/*'