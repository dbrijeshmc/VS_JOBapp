version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."

  pre_build:
    commands:
      - echo "Installing frontend dependencies..."
      - cd frontend
      - npm ci
      - cd ..

      - echo "Installing backend dependencies..."
      - cd backend
      - npm ci
      - cd ..

  build:
    commands:
      - echo "Building frontend..."
      - cd frontend
      - npm run build
      - cd ..

      - echo "Building backend..."
      - cd backend
      - npm run build
      - cd ..

  post_build:
    commands:
      - echo "Build completed successfully!"

artifacts:
  files:
    - '**/*'
  discard-paths: no
